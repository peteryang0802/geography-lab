<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按中图版（北京版）七年级上册回顾课堂，用地图和观察解释一个现实问题。">
  <meta name="theme-color" content="#f5f4ed">
  <meta name="robots" content="noindex">
  <title>地理实验台 · 七年级上册</title>
  <link rel="icon" type="image/png" href="./assets/compass.png">
  <script>
    const isHome = !location.hash.startsWith('#/') || location.hash === '#/';
    const view = new URLSearchParams(location.search).get('view');
    if (isHome && view !== 'nearby' && view !== 'fieldwork') {
      const cover = document.createElement('link');
      if ('imageSrcset' in cover) {
        cover.rel = 'preload';
        cover.as = 'image';
        cover.imageSrcset = './assets/landscape-420.webp 420w, ./assets/landscape-small.webp 640w';
        cover.imageSizes = '(max-width: 700px) 92vw, 480px';
        cover.fetchPriority = 'high';
        document.head.append(cover);
      }
    }
  </script>
  <link rel="stylesheet" href="./assets/styles.css?v=6">
  <script type="module" src="./src/app.js?v=6"></script>
</head>
<body>
  <a class="skip" href="#content">跳到内容</a>
  <header class="site-header">
    <div class="bar">
      <a href="#/" class="brand" aria-label="地理实验台首页">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>地理实验台<span class="brand-sub">七年级上册</span></span>
      </a>
      <nav aria-label="主导航">
        <a href="#/textbook" data-nav="home">课本</a>
        <a href="#/explore" data-nav="explore">查知识</a>
        <a href="#/review" data-nav="review">复习</a>
      </nav>
    </div>
  </header>
  <main class="wrap" id="content" tabindex="-1">
    <noscript>打开浏览器的 JavaScript 设置后，即可使用课本目录和互动实验。</noscript>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>地理实验台 · 中图北京版 七年级上册</span>
    </div>
  </footer>
  <div id="announcement" class="visually-hidden" role="status" aria-live="polite"></div>
</body>
</html>
